<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineer Connect: ideas, connections and jobs for UK engineers</title>
  <!-- share-and-search -->
  <meta name="description" content="A free community for engineers across the UK. Share ideas, connect with other engineers, find engineering jobs and keep up with the latest engineering news.">
  <link rel="canonical" href="https://jakemarshall6739476-gif.github.io/engineer.connect/">
  <meta name="theme-color" content="#11161d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Engineer Connect">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="Engineer Connect: ideas, connections and jobs for UK engineers">
  <meta property="og:description" content="A free community for engineers across the UK. Share ideas, connect with other engineers, find engineering jobs and keep up with the latest engineering news.">
  <meta property="og:url" content="https://jakemarshall6739476-gif.github.io/engineer.connect/">
  <meta property="og:image" content="https://jakemarshall6739476-gif.github.io/engineer.connect/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Engineer Connect: where engineers build together">
  <meta name="twitter:card" content="summary_large_image">
  <!-- /share-and-search -->
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <!-- Opening screen: plays once per visit, click or press any key to skip -->
  <div class="splash" id="splash" hidden>
    <svg class="splash-gears" viewBox="0 0 100 80" aria-hidden="true">
      <g class="gear big">
        <circle class="teeth" cx="36" cy="46" r="22" stroke-dasharray="5.76 5.76"></circle>
        <circle class="body" cx="36" cy="46" r="18"></circle>
        <circle class="hole" cx="36" cy="46" r="6"></circle>
      </g>
      <g class="gear small">
        <circle class="teeth" cx="66" cy="26" r="14" stroke-dasharray="5.5 5.5"></circle>
        <circle class="body" cx="66" cy="26" r="10"></circle>
        <circle class="hole" cx="66" cy="26" r="3.5"></circle>
      </g>
    </svg>
    <h1 class="splash-name" id="splash-name" aria-label="Engineer Connect"></h1>
    <div class="splash-line"></div>
    <p class="splash-tagline">Where engineers build together</p>
    <div class="splash-skip">Click to skip</div>
  </div>

  <header class="topbar">
    <a class="brand" href="index.html">Engineer<span>Connect</span></a>
  </header>

  <main>
    <section class="hero">
      <div class="step">Step 1 of 2</div>
      <h1>What kind of engineer are you?</h1>
      <p>Pick the area you work in. You can change it any time.</p>
    </section>

    <div class="choices" id="disciplines"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=15"></script>
  <script src="data.js?v=15"></script>
  <script src="app.js?v=15"></script>
  <script>
    // Opening screen: only the first time the site is opened in a visit.
    (function () {
      var seen = false;
      try { seen = sessionStorage.getItem("ec_splash_seen") === "1"; } catch (e) {}
      if (seen) return;
      try { sessionStorage.setItem("ec_splash_seen", "1"); } catch (e) {}

      var splash = document.getElementById("splash");
      // Each letter is its own piece so they can rise one after another.
      var letters = "Engineer".split("").map(function (c) { return [c, ""]; })
        .concat("Connect".split("").map(function (c) { return [c, "accent"]; }));
      document.getElementById("splash-name").innerHTML = letters.map(function (l, i) {
        return '<span aria-hidden="true" class="' + l[1] + '" style="--i:' + i + '">' + l[0] + "</span>";
      }).join("");
      splash.hidden = false;

      var closed = false;
      function close() {
        if (closed) return;
        closed = true;
        splash.classList.add("leaving");
        setTimeout(function () { splash.remove(); }, 650);
      }
      setTimeout(close, 2900);
      splash.addEventListener("click", close);
      document.addEventListener("keydown", close, { once: true });
    })();

    // Build one card per discipline. Clicking a card goes to the goals page.
    document.getElementById("disciplines").innerHTML = Object.keys(DISCIPLINES).map(function (key) {
      var d = DISCIPLINES[key];
      return '<a class="choice" href="goals.html?d=' + key + '">' +
        '<div class="icon">' + d.icon + '</div>' +
        '<h2>' + d.name + '</h2>' +
        '<p>' + d.blurb + '</p></a>';
    }).join("");
  </script>
</body>
</html>
