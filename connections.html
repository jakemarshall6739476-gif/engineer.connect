<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find engineers · Engineer Connect</title>
  <!-- share-and-search -->
  <meta name="description" content="Find and connect with mechanical, electrical, chemical, civil, aerospace, software and nuclear engineers across the UK.">
  <link rel="canonical" href="https://jakemarshall6739476-gif.github.io/engineer.connect/connections.html">
  <meta name="theme-color" content="#11161d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Engineer Connect">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="Find engineers · Engineer Connect">
  <meta property="og:description" content="Find and connect with mechanical, electrical, chemical, civil, aerospace, software and nuclear engineers across the UK.">
  <meta property="og:url" content="https://jakemarshall6739476-gif.github.io/engineer.connect/connections.html">
  <meta property="og:image" content="https://jakemarshall6739476-gif.github.io/engineer.connect/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Engineer Connect: where engineers build together">
  <meta name="twitter:card" content="summary_large_image">
  <!-- /share-and-search -->
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Engineer<span>Connect</span></a>
    <nav class="nav">
      <a href="ideas.html">Ideas</a>
      <a href="connections.html" class="current">Connections</a>
      <a href="jobs.html">Jobs</a>
      <a href="news.html">News & Links</a>
    </nav>
    <a class="chip" id="discipline-chip" hidden></a>
  </header>

  <main>
    <section class="hero">
      <h1>🤝 Connections</h1>
      <p>Find engineers to learn from, work with, or swap ideas with.</p>
    </section>

    <div class="panel" id="requests-panel" hidden>
      <h2>Requests for you</h2>
      <div id="incoming"></div>
    </div>
    <div class="panel" id="signed-out-panel" hidden>
      <p class="meta" id="signed-out-text" style="margin:0"></p>
    </div>
    <p class="msg" id="list-msg" role="status"></p>

    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <input type="search" id="search" placeholder="Search by name, skill or location…">
    </div>
    <div class="grid" id="people"></div>

    <a class="back" href="goals.html">← Back to options</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=15"></script>
  <script src="data.js?v=15"></script>
  <script src="app.js?v=15"></script>
  <script>
    var me = currentDiscipline();
    showDisciplineChip(me);

    var people = [];        // real member profiles
    var links = [];         // my connection requests (sent and received)
    var filter = me || "all";
    var $ = function (id) { return document.getElementById(id); };

    function message(html, ok) {
      $("list-msg").innerHTML = html || "";
      $("list-msg").className = "msg" + (html ? (ok ? " ok" : " error") : "");
    }
    function initials(name) {
      return String(name || "?").split(/\s+/).map(function (p) { return p.charAt(0); }).join("").slice(0, 2).toUpperCase();
    }
    function nameOf(id) {
      var p = people.find(function (x) { return x.id === id; });
      return p ? p.name : "A member";
    }
    // My request with this person, whichever way round it was sent
    function linkWith(id) {
      return links.find(function (l) { return l.from_user === id || l.to_user === id; });
    }

    function others() {
      var user = EC.user();
      return people.filter(function (p) { return !user || p.id !== user.id; });
    }
    // While there are only a few members, show the examples too (clearly labelled)
    function withExamples(list) {
      if (others().length >= 3) return list;
      return list.concat(SAMPLE_PEOPLE.map(function (s) {
        return { id: "ex" + s.id, example: true, name: s.name, role: s.role, discipline: s.discipline,
                 location: s.location, skills: s.skills, looking: s.looking };
      }));
    }

    function buttonFor(p) {
      var user = EC.user();
      if (p.example) return '<span class="tag">Example</span>';
      var l = linkWith(p.id);
      if (!l) return '<button class="btn" data-connect="' + p.id + '">Connect</button>';
      if (l.status === "accepted") return '<span class="btn secondary" aria-disabled="true">✓ Connected</span>';
      if (user && l.to_user === user.id && l.status === "pending")
        return '<button class="btn" data-answer="' + l.id + '" data-status="accepted">Accept</button>';
      if (user && l.from_user === user.id) return '<button class="btn secondary" data-cancel="' + l.id + '" title="Click to cancel">Request sent</button>';
      return "";
    }

    function render() {
      var user = EC.user();
      var q = $("search").value.toLowerCase();
      var list = withExamples(others())
        .filter(function (p) { return filter === "all" || p.discipline === filter; })
        .filter(function (p) {
          return [p.name, p.role, p.location, p.looking].concat(p.skills || []).join(" ").toLowerCase().indexOf(q) !== -1;
        });

      $("people").innerHTML = list.length ? list.map(function (p) {
        var area = DISCIPLINES[p.discipline];
        var sub = [p.role, p.location].filter(Boolean).map(escapeHtml).join(" · ");
        return '<article class="card' + (p.example ? " example" : "") + '">' +
          '<div class="person"><div class="avatar">' + escapeHtml(initials(p.name)) + "</div>" +
          "<div><h3>" + escapeHtml(p.name) + '</h3><div class="meta">' + sub + "</div></div></div>" +
          (area ? '<div class="meta">' + area.icon + " " + area.name + "</div>" : "") +
          (p.looking ? "<p><strong>Looking for:</strong> " + escapeHtml(p.looking) + "</p>" : "") +
          '<div class="tags">' + (p.skills || []).map(function (s) { return '<span class="tag">' + escapeHtml(s) + "</span>"; }).join("") + "</div>" +
          '<div class="card-foot"><span></span>' + buttonFor(p) + "</div>" +
          "</article>";
      }).join("") : '<div class="empty">No engineers match that search yet.</div>';

      // Requests waiting for my answer
      var incoming = user ? links.filter(function (l) { return l.to_user === user.id && l.status === "pending"; }) : [];
      $("requests-panel").hidden = !incoming.length;
      $("incoming").innerHTML = incoming.map(function (l) {
        return '<div class="row request-row"><span><strong>' + escapeHtml(nameOf(l.from_user)) + "</strong> would like to connect.</span>" +
          '<span class="row" style="gap:8px; flex:0 0 auto">' +
          '<button class="btn secondary" data-answer="' + l.id + '" data-status="declined">Decline</button>' +
          '<button class="btn" data-answer="' + l.id + '" data-status="accepted">Accept</button></span></div>';
      }).join("");
    }

    function refresh() {
      return Promise.all([EC.listProfiles(), EC.myConnections()]).then(function (res) {
        if (res[0].error) { message("Couldn't load engineers just now. Please refresh the page."); return; }
        people = res[0].data || [];
        links = res[1].data || [];
        render();
      });
    }

    buildTabs($("tabs"), filter, function (key) { filter = key; render(); });
    $("search").oninput = render;

    EC.onChange(function (user, profile) {
      $("signed-out-panel").hidden = !!user;
      $("signed-out-text").innerHTML = EC.signInPrompt("connect with engineers and appear on this page yourself");
      if (user && profile && !profile.name) message('Add your name on <a href="account.html">My account</a> so other engineers can find you.');
      refresh();
    });

    function done(res, okText) {
      if (res.error) message("Couldn't save that just now. Please try again.");
      else message(okText || "", true);
      refresh();
    }

    // Connect, cancel, accept and decline
    document.addEventListener("click", function (e) {
      var connect = e.target.closest("[data-connect]"),
          cancel = e.target.closest("[data-cancel]"),
          answer = e.target.closest("[data-answer]");
      if (!connect && !cancel && !answer) return;
      if (!EC.user()) { message(EC.signInPrompt("connect with engineers")); return; }
      var btn = connect || cancel || answer;
      btn.disabled = true;
      if (connect) EC.sendConnection(connect.dataset.connect).then(function (r) { done(r, "✓ Request sent to " + escapeHtml(nameOf(connect.dataset.connect)) + "."); });
      if (cancel) EC.removeConnection(Number(cancel.dataset.cancel)).then(function (r) { done(r, "Request cancelled."); });
      if (answer) EC.answerConnection(Number(answer.dataset.answer), answer.dataset.status).then(function (r) {
        done(r, answer.dataset.status === "accepted" ? "✓ You're now connected. Messaging is coming soon." : "Request declined.");
      });
    });
  </script>
</body>
</html>
