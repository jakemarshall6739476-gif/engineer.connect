# Refreshes the news banner's headlines every hour once the site is on GitHub.
# It runs update_news.py and saves the new news.json, which the host (GitHub Pages
# or Netlify linked to this repository) then publishes automatically.
name: Update news headlines

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:        # also allows a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest headlines
        run: python update_news.py
      - name: Save news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news headlines"
          git push
