# Publishes Engineer Connect to GitHub Pages.
# Runs whenever changes are pushed, every hour (to refresh the news banner's headlines),
# and on demand from the Actions tab ("Run workflow").
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest headlines
        run: python update_news.py
        continue-on-error: true   # if every feed is down, keep the headlines already saved

      # Free Supabase projects pause after 7 days without use; a tiny hourly read keeps
      # accounts and posts online. Uses the public (publishable) key from config.js.
      - name: Keep the database awake
        continue-on-error: true
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js)
          curl -fsS -o /dev/null "$URL/rest/v1/ideas?select=id&limit=1" -H "apikey: $KEY" && echo "Database is awake"

      - name: Gather the files visitors need
        run: |
          mkdir _site
          cp *.html *.css *.js news.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
