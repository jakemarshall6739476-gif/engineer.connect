# Publishes Engineer Connect to GitHub Pages.
# Runs whenever changes are pushed, every hour (to refresh the news banner's headlines),
# and on demand from the Actions tab ("Run workflow").
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest headlines
        run: python update_news.py
        continue-on-error: true   # if every feed is down, keep the headlines already saved

      - name: Gather the files visitors need
        run: |
          mkdir _site
          cp *.html *.css *.js news.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
