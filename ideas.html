<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineering ideas · Engineer Connect</title>
  <!-- share-and-search -->
  <meta name="description" content="Share engineering project ideas, get feedback, and find people to build them with.">
  <link rel="canonical" href="https://jakemarshall6739476-gif.github.io/engineer.connect/ideas.html">
  <meta name="theme-color" content="#11161d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Engineer Connect">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="Engineering ideas · Engineer Connect">
  <meta property="og:description" content="Share engineering project ideas, get feedback, and find people to build them with.">
  <meta property="og:url" content="https://jakemarshall6739476-gif.github.io/engineer.connect/ideas.html">
  <meta property="og:image" content="https://jakemarshall6739476-gif.github.io/engineer.connect/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Engineer Connect: where engineers build together">
  <meta name="twitter:card" content="summary_large_image">
  <!-- /share-and-search -->
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Engineer<span>Connect</span></a>
    <nav class="nav">
      <a href="ideas.html" class="current">Ideas</a>
      <a href="connections.html">Connections</a>
      <a href="jobs.html">Jobs</a>
      <a href="news.html">News & Links</a>
    </nav>
    <a class="chip" id="discipline-chip" hidden></a>
  </header>

  <main>
    <section class="hero">
      <h1>💡 Ideas</h1>
      <p>Share what you're working on and back the ideas you like.</p>
    </section>

    <div class="panel" id="signed-out-panel" hidden>
      <h2>Share an idea</h2>
      <p class="meta" id="signed-out-text"></p>
    </div>

    <form class="panel" id="idea-form" hidden>
      <h2>Share an idea</h2>
      <label for="title">Title</label>
      <input id="title" required maxlength="100" placeholder="e.g. Cheaper way to test weld quality">
      <label for="body">Describe it</label>
      <textarea id="body" required maxlength="600" placeholder="What's the problem, and what kind of help are you after?"></textarea>
      <label for="area">Area</label>
      <select id="area"></select>
      <label for="tags">Tags (separate with commas)</label>
      <input id="tags" placeholder="e.g. welding, sensors">
      <p class="msg" id="idea-msg" role="status"></p>
      <div style="margin-top:12px"><button class="btn" type="submit">Post idea</button></div>
      <p class="small-print" id="posting-as"></p>
    </form>

    <p class="msg" id="list-msg" role="status"></p>
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <input type="search" id="search" placeholder="Search ideas…">
    </div>
    <div class="grid" id="ideas"></div>

    <a class="back" href="goals.html">← Back to options</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=15"></script>
  <script src="data.js?v=15"></script>
  <script src="app.js?v=15"></script>
  <script>
    var me = currentDiscipline();
    showDisciplineChip(me);

    var ideas = [];         // real ideas from the database
    var backed = [];        // ids of ideas I've backed
    var filter = me || "all";
    var $ = function (id) { return document.getElementById(id); };

    // Area dropdown on the form, starting on the area the user picked
    var areaSelect = $("area");
    areaSelect.innerHTML = Object.keys(DISCIPLINES).map(function (k) {
      return '<option value="' + k + '">' + DISCIPLINES[k].icon + " " + DISCIPLINES[k].name + "</option>";
    }).join("");
    areaSelect.value = me || "mechanical";

    function message(id, html, ok) {
      $(id).innerHTML = html || "";
      $(id).className = "msg" + (html ? (ok ? " ok" : " error") : "");
    }

    // While there are only a few real ideas, show the examples too (clearly labelled)
    function withExamples(list) {
      if (ideas.length >= 3) return list;
      return list.concat(SAMPLE_IDEAS.map(function (s) {
        return { id: "ex" + s.id, example: true, discipline: s.discipline, title: s.title, body: s.body,
                 tags: s.tags, author_name: s.author, backers: s.votes };
      }));
    }

    function render() {
      var q = $("search").value.toLowerCase();
      var user = EC.user();
      var list = withExamples(ideas.slice())
        .filter(function (i) { return filter === "all" || i.discipline === filter; })
        .filter(function (i) { return (i.title + " " + i.body + " " + (i.tags || []).join(" ")).toLowerCase().indexOf(q) !== -1; })
        .sort(function (a, b) { return (a.example - b.example) || (b.backers - a.backers); });

      $("ideas").innerHTML = list.length ? list.map(function (i) {
        var area = DISCIPLINES[i.discipline];
        var mine = user && i.author === user.id;
        var hasBacked = backed.indexOf(i.id) !== -1;
        var foot = i.example
          ? '<span class="meta">' + i.backers + ' backing</span><span class="tag">Example</span>'
          : '<span class="meta">' + i.backers + " backing</span>" +
            '<span class="row" style="gap:8px">' +
              (mine ? '<button class="btn secondary" data-delete="' + i.id + '">Delete</button>' : "") +
              '<button class="btn ' + (hasBacked ? "" : "secondary") + '" data-back="' + i.id + '">' + (hasBacked ? "✓ Backed" : "👍 Back this") + "</button>" +
            "</span>";
        return '<article class="card' + (i.example ? " example" : "") + '">' +
          '<div class="meta">' + (area ? area.icon + " " + area.name : "") + " · by " + escapeHtml(i.author_name || "Member") + (mine ? " (you)" : "") + "</div>" +
          "<h3>" + escapeHtml(i.title) + "</h3>" +
          "<p>" + escapeHtml(i.body) + "</p>" +
          '<div class="tags">' + (i.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join("") + "</div>" +
          '<div class="card-foot">' + foot + "</div>" +
          "</article>";
      }).join("") : '<div class="empty">No ideas here yet. Be the first to share one!</div>';
    }

    function refresh() {
      return Promise.all([EC.listIdeas(), EC.myBackedIdeaIds()]).then(function (res) {
        if (res[0].error) { message("list-msg", "Couldn't load ideas just now. Please refresh the page."); return; }
        message("list-msg", "");
        ideas = res[0].data || [];
        backed = res[1].data || [];
        render();
      });
    }

    buildTabs($("tabs"), filter, function (key) { filter = key; render(); });
    $("search").oninput = render;

    // Show the form to members, a sign-in prompt to everyone else
    EC.onChange(function (user, profile) {
      $("idea-form").hidden = !user;
      $("signed-out-panel").hidden = !!user;
      $("signed-out-text").innerHTML = EC.signInPrompt("share your own ideas and back other people's");
      $("posting-as").textContent = user ? "Posting as " + ((profile && profile.name) || "you") + ". You can delete your ideas at any time." : "";
      refresh();
    });

    // Back / un-back, and delete your own ideas
    $("ideas").onclick = function (e) {
      var back = e.target.closest("[data-back]"), del = e.target.closest("[data-delete]");
      if (back) {
        if (!EC.user()) { message("list-msg", EC.signInPrompt("back ideas")); return; }
        var id = Number(back.dataset.back);
        back.disabled = true;
        var undo = backed.indexOf(id) !== -1;
        (undo ? EC.unbackIdea(id) : EC.backIdea(id)).then(function (res) {
          if (res.error) message("list-msg", "Couldn't save that just now. Please try again.");
          refresh();
        });
      }
      if (del && confirm("Delete this idea? This can't be undone.")) {
        EC.deleteIdea(Number(del.dataset.delete)).then(function (res) {
          if (res.error) message("list-msg", "Couldn't delete that just now. Please try again.");
          refresh();
        });
      }
    };

    // Post a new idea
    $("idea-form").onsubmit = function (e) {
      e.preventDefault();
      var title = $("title").value.trim(), body = $("body").value.trim();
      if (!title || !body) { message("idea-msg", "Please give your idea a title and a description."); return; }
      var btn = this.querySelector("[type=submit]");
      btn.disabled = true;
      EC.postIdea({
        discipline: areaSelect.value,
        title: title,
        body: body,
        tags: $("tags").value.split(",").map(function (t) { return t.trim(); }).filter(Boolean).slice(0, 10)
      }).then(function (res) {
        btn.disabled = false;
        if (res.error) { message("idea-msg", "Couldn't post your idea just now. Please try again."); return; }
        e.target.reset();
        areaSelect.value = me || "mechanical";
        message("idea-msg", "✓ Your idea is posted. Everyone can see it now.", true);
        filter = "all";
        buildTabs($("tabs"), "all", function (key) { filter = key; render(); });
        refresh();
      });
    };
  </script>
</body>
</html>
